version: "3.8"
services:
  client:
    build: /client
    ports:
      - "3000:3000"
    volumes:
      - ./client:/client
      - /client/node_modules
  server:
    build: /server
    ports:
      - "5000:5000"
    volumes:
      - ./server:/server
      - /server/node_modules
    depends_on:
      - db
    links:
      - db

  db:
    image: postgres
    container_name: db
    restart: always
    ports:
      - "5430:5432"
    expose:
      - 5430
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Aa123456
    volumes:
      - database:/var/lib/postgresql/data

volumes:
  database:
